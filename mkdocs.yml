site_name: anafibre
site_description: Analytical mode solver for cylindrical step-index fibres
site_url: https://anafibre.readthedocs.io/
repo_url: https://github.com/Sevastienn/anafibre
repo_name: Sevastienn/anafibre

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
  - API Reference:
    - Overview: api/index.md
    - dispersion: api/dispersion.md    
    - fibre: api/fibre.md
    - fields: api/fields.md
    - plotting: api/plotting.md
    - utils: api/utils.md
  - Explanation:
    - Background theory: explanation/how-it-works.md

theme:
  name: material
  logo: images/logo.svg
  favicon: images/round-icon.svg

  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - toc.integrate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            members_order: source
            show_source: false
            show_root_heading: false
            show_signature: false
            separate_signature: false
            inherited_members: false
            show_root_toc_entry: false
            merge_init_into_class: false


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
      toc_depth: 1-4

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/guidedmode.css
